<svg width="900" height="360" viewBox="0 0 900 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Blue Gradient Background -->
    <linearGradient id="background"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2563EB"/>

    </linearGradient>

    <!-- Name Glow -->
    <filter id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feGaussianBlur
        stdDeviation="3"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ========================= -->
  <!-- BLUE BACKGROUND -->
  <!-- ========================= -->

  <rect
    width="900"
    height="360"
    rx="28"
    fill="url(#background)"
  />


  <!-- ========================= -->
  <!-- DECORATIVE CIRCLES -->
  <!-- ========================= -->

  <circle
    cx="90"
    cy="70"
    r="45"
    fill="#60A5FA"
    opacity="0.08">

    <animate
      attributeName="r"
      values="45;58;45"
      dur="5s"
      repeatCount="indefinite"/>

  </circle>


  <circle
    cx="815"
    cy="290"
    r="60"
    fill="#93C5FD"
    opacity="0.07">

    <animate
      attributeName="r"
      values="60;75;60"
      dur="6s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ========================= -->
  <!-- HEY -->
  <!-- ========================= -->

  <text
    x="450"
    y="75"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="Arial, sans-serif"
    font-size="32"
    font-weight="600">

    Hey 👋

    <animate
      attributeName="opacity"
      values="0.75;1;0.75"
      dur="3s"
      repeatCount="indefinite"/>

  </text>


  <!-- ========================= -->
  <!-- I'M -->
  <!-- ========================= -->

  <text
    x="450"
    y="130"
    text-anchor="middle"
    fill="#E2E8F0"
    font-family="Arial, sans-serif"
    font-size="34"
    font-weight="600">

    I'm

    <animate
      attributeName="opacity"
      values="0.7;1;0.7"
      dur="3s"
      repeatCount="indefinite"/>

  </text>


  <!-- ========================= -->
  <!-- SAIKAT MITRA -->
  <!-- ========================= -->

  <text
    x="450"
    y="205"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="Arial, sans-serif"
    font-size="58"
    font-weight="700"
    filter="url(#glow)">

    Saikat Mitra

    <animate
      attributeName="opacity"
      values="0.85;1;0.85"
      dur="4s"
      repeatCount="indefinite"/>

    <animate
      attributeName="y"
      values="205;200;205"
      dur="4s"
      repeatCount="indefinite"/>

  </text>


  <!-- ========================= -->
  <!-- ROLE -->
  <!-- ========================= -->

  <text
    x="450"
    y="260"
    text-anchor="middle"
    fill="#BFDBFE"
    font-family="Arial, sans-serif"
    font-size="21"
    font-weight="600">

    AI Developer | Full Stack Developer | B.Tech IT Student

  </text>


  <!-- ========================= -->
  <!-- SUBTLE BOTTOM LINE -->
  <!-- ========================= -->

  <line
    x1="250"
    y1="300"
    x2="650"
    y2="300"
    stroke="#60A5FA"
    stroke-width="2"
    opacity="0.35">

    <animate
      attributeName="x1"
      values="250;220;250"
      dur="4s"
      repeatCount="indefinite"/>

    <animate
      attributeName="x2"
      values="650;680;650"
      dur="4s"
      repeatCount="indefinite"/>

  </line>

</svg>
